---
- name: Deploy Calculator App with Docker
  hosts: webserver
  become: yes
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Pull Docker Image
      command: docker pull mydockerhub/scientific-calculator:latest

    - name: Stop Existing Container (if running)
      command: docker stop scientific-calculator
      ignore_errors: yes  # Ignore errors if the container is not running

    - name: Remove Existing Container (if exists)
      command: docker rm scientific-calculator
      ignore_errors: yes  # Ignore errors if the container does not exist

    - name: Run Docker Container with Fixed Name
      command: docker run -dit --name scientific-calculator mydockerhub/scientific-calculator:latest
    